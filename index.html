<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 21 de Marzo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
  }

  /* Fondo animado */
  .bg-gradient {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, #2d1060 0%, #1a0a2e 70%);
    z-index: 0;
  }

  /* Partículas flotantes */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffd700;
    opacity: 0;
    animation: floatUp var(--dur) ease-in infinite;
    animation-delay: var(--delay);
    left: var(--x);
    bottom: -10px;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
  }

  /* Escena principal */
  .scene {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }

  /* ===== FLORES ===== */
  .flowers-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .flower {
    position: absolute;
    transform-origin: bottom center;
    animation: growStem 1.5s ease-out forwards;
    opacity: 0;
  }

  @keyframes growStem {
    0% { transform: scaleY(0) translateY(20px); opacity: 0; }
    100% { transform: scaleY(1) translateY(0); opacity: 1; }
  }

  .flower svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Pétalos abriéndose */
  .petal {
    transform-origin: center bottom;
    animation: openPetal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: var(--pd);
    transform: rotate(var(--pr)) scaleY(0);
  }

  @keyframes openPetal {
    0% { transform: rotate(var(--pr)) scaleY(0); }
    60% { transform: rotate(var(--pr)) scaleY(1.1); }
    100% { transform: rotate(var(--pr)) scaleY(1); }
  }

  /* Centro de la flor */
  .flower-center {
    animation: popCenter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: var(--cd);
    transform: scale(0);
    transform-origin: center;
  }

  @keyframes popCenter {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* ===== MENSAJE CENTRAL ===== */
  .message-box {
    position: relative;
    z-index: 20;
    text-align: center;
    opacity: 0;
    animation: revealMessage 1.5s ease-out 2.8s forwards;
  }

  @keyframes revealMessage {
    0% { opacity: 0; transform: translateY(30px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .date-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: #ffd700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.85;
  }

  .main-message {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3.5rem, 10vw, 7rem);
    font-weight: 700;
    background: linear-gradient(135deg, #ffe066 0%, #ffd700 40%, #ffb300 70%, #ffe066 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.4));
    animation: shimmer 3s ease-in-out infinite 4s;
  }

  @keyframes shimmer {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.3)); }
    50% { filter: drop-shadow(0 0 50px rgba(255,215,0,0.7)); }
  }

  .sub-message {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 600;
    color: #fff0a0;
    margin-top: 8px;
    opacity: 0;
    animation: revealSub 1.2s ease-out 3.8s forwards;
  }

  @keyframes revealSub {
    0% { opacity: 0; transform: translateY(15px); }
    100% { opacity: 0.95; transform: translateY(0); }
  }

  /* Decoración de líneas */
  .deco-line {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
    margin: 16px auto;
    opacity: 0;
    animation: revealLine 1s ease-out 3.3s forwards;
  }

  @keyframes revealLine {
    0% { opacity: 0; width: 0; }
    100% { opacity: 0.6; width: 200px; }
  }

  /* Corazones flotantes */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  .heart {
    position: absolute;
    font-size: var(--hs);
    opacity: 0;
    animation: floatHeart var(--hd) ease-in-out infinite;
    animation-delay: var(--hdelay);
    left: var(--hx);
    bottom: 10%;
  }

  @keyframes floatHeart {
    0% { opacity: 0; transform: translateY(0) rotate(-10deg) scale(0.8); }
    20% { opacity: 0.9; }
    80% { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-70vh) rotate(10deg) scale(1.2); }
  }

  /* Brillo orbital */
  .glow-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,215,0,0.15);
    animation: pulseRing 4s ease-in-out infinite;
  }

  @keyframes pulseRing {
    0%, 100% { opacity: 0.1; transform: scale(0.95); }
    50% { opacity: 0.4; transform: scale(1.05); }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>

<!-- Partículas doradas -->
<div class="particles" id="particles"></div>

<!-- Corazones -->
<div class="hearts" id="hearts"></div>

<!-- Flores decorativas -->
<div class="flowers-container" id="flowersContainer"></div>

<!-- Mensaje principal -->
<div class="scene">
  <!-- Anillos de brillo -->
  <div class="glow-ring" style="width:500px;height:500px;animation-delay:0s;"></div>
  <div class="glow-ring" style="width:700px;height:700px;animation-delay:1.5s;"></div>

  <div class="message-box">
    <div class="date-text">✦ Feliz 21 de Marzo ✦</div>
    <div class="deco-line"></div>
    <div class="main-message">Feliz<br>Primavera</div>
    <div class="deco-line" style="animation-delay:3.5s;"></div>
    <div class="sub-message">Te Quiero... 🌻</div>
  </div>
</div>

<script>
// ===== PARTÍCULAS =====
const particlesEl = document.getElementById('particles');
for(let i = 0; i < 40; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const dur = 4 + Math.random() * 6;
  const delay = Math.random() * 8;
  p.style.cssText = `--dur:${dur}s; --delay:${delay}s; --x:${Math.random()*100}%;`;
  // Varied sizes
  const s = 2 + Math.random() * 5;
  p.style.width = s + 'px';
  p.style.height = s + 'px';
  // Some are star-shaped (just circles with glow)
  if(Math.random() > 0.5) p.style.boxShadow = `0 0 6px 2px rgba(255,215,0,0.6)`;
  particlesEl.appendChild(p);
}

// ===== CORAZONES =====
const heartsEl = document.getElementById('hearts');
const heartChars = ['💛','🌻','✨','💫','🌼'];
for(let i = 0; i < 12; i++){
  const h = document.createElement('div');
  h.className = 'heart';
  const dur = 5 + Math.random() * 5;
  const delay = 3 + Math.random() * 8;
  const size = (1 + Math.random() * 1.5) + 'rem';
  h.style.cssText = `--hd:${dur}s; --hdelay:${delay}s; --hx:${5+Math.random()*90}%; --hs:${size};`;
  h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
  heartsEl.appendChild(h);
}

// ===== FLORES SVG =====
const container = document.getElementById('flowersContainer');

function createFlower(x, y, size, delay, petalColor = '#FFD700', variant = 0) {
  const wrapper = document.createElement('div');
  wrapper.className = 'flower';
  wrapper.style.cssText = `
    left: ${x}%;
    bottom: ${y}%;
    width: ${size}px;
    height: ${size * 1.4}px;
    animation-delay: ${delay}s;
  `;

  const numPetals = variant === 0 ? 8 : 6;
  const stemH = size * 0.7;
  const cx = size / 2;
  const cy = size * 0.55;
  const petalLen = size * 0.38;
  const petalW = size * 0.16;
  const centerR = size * 0.13;

  let petalsHTML = '';
  for(let i = 0; i < numPetals; i++) {
    const angle = (360 / numPetals) * i;
    const pd = delay + 0.8 + (i * 0.08);
    petalsHTML += `
      <ellipse
        class="petal"
        cx="${cx}"
        cy="${cy - petalLen * 0.5}"
        rx="${petalW}"
        ry="${petalLen}"
        fill="${petalColor}"
        opacity="0.92"
        style="--pr:${angle}deg; --pd:${pd}s; transform-origin:${cx}px ${cy}px;"
      />`;
  }

  const leafDelay = delay + 0.4;
  const stemY1 = size * 1.35;
  const stemY2 = cy;

  wrapper.innerHTML = `
    <svg viewBox="0 0 ${size} ${size * 1.4}" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <!-- Stem -->
      <line x1="${cx}" y1="${stemY1}" x2="${cx}" y2="${stemY2}"
        stroke="#4a8c3f" stroke-width="${size*0.04}" stroke-linecap="round"
        style="animation:growStem 1.2s ease-out ${delay}s forwards; transform-origin: ${cx}px ${stemY1}px;"
      />
      <!-- Leaf left -->
      <ellipse cx="${cx - size*0.14}" cy="${size*1.0}" rx="${size*0.1}" ry="${size*0.07}"
        fill="#4a8c3f" opacity="0.8"
        transform="rotate(-40 ${cx - size*0.14} ${size*1.0})"
        style="animation:openPetal 0.8s ease-out ${leafDelay}s forwards; transform-origin:${cx}px ${size*1.1}px; transform:rotate(-40deg) scaleY(0);"
      />
      <!-- Leaf right -->
      <ellipse cx="${cx + size*0.14}" cy="${size*0.85}" rx="${size*0.1}" ry="${size*0.07}"
        fill="#4a8c3f" opacity="0.8"
        transform="rotate(40 ${cx + size*0.14} ${size*0.85})"
        style="animation:openPetal 0.8s ease-out ${leafDelay+0.15}s forwards; transform-origin:${cx}px ${size*0.95}px; transform:rotate(40deg) scaleY(0);"
      />
      <!-- Petals -->
      ${petalsHTML}
      <!-- Center dark -->
      <circle class="flower-center" cx="${cx}" cy="${cy}" r="${centerR * 1.1}"
        fill="#5c3a00"
        style="--cd:${delay+1.2}s; transform-origin:${cx}px ${cy}px;"
      />
      <!-- Center bright -->
      <circle class="flower-center" cx="${cx}" cy="${cy}" r="${centerR * 0.65}"
        fill="#c8860a"
        style="--cd:${delay+1.3}s; transform-origin:${cx}px ${cy}px;"
      />
      <!-- Center shine -->
      <circle cx="${cx - centerR*0.2}" cy="${cy - centerR*0.2}" r="${centerR*0.2}"
        fill="rgba(255,220,100,0.6)"
        style="animation:popCenter 0.4s ease-out ${delay+1.35}s forwards; transform:scale(0); transform-origin:${cx}px ${cy}px;"
      />
    </svg>
  `;

  container.appendChild(wrapper);
}

// Flores grandes en los costados
const flowerData = [
  // [x%, y%, size, delay, color, variant]
  [2,  0, 110, 0.0, '#FFD700', 0],
  [8,  0,  90, 0.2, '#FFC200', 1],
  [14, 0, 100, 0.1, '#FFE040', 0],
  [20, 0,  80, 0.3, '#FFD000', 1],
  [26, 0,  70, 0.4, '#FFCA00', 0],

  [74, 0,  70, 0.4, '#FFD700', 1],
  [80, 0,  80, 0.3, '#FFCA00', 0],
  [86, 0, 100, 0.1, '#FFE040', 1],
  [92, 0,  90, 0.2, '#FFC200', 0],
  [97, 0, 110, 0.0, '#FFD700', 1],

  // Flores más pequeñas intercaladas
  [5,  0,  60, 0.5, '#FFE070', 1],
  [11, 0,  65, 0.6, '#FFD700', 0],
  [17, 0,  55, 0.7, '#FFBA00', 1],
  [23, 0,  50, 0.8, '#FFE040', 0],

  [77, 0,  50, 0.8, '#FFE040', 1],
  [83, 0,  55, 0.7, '#FFBA00', 0],
  [89, 0,  65, 0.6, '#FFD700', 1],
  [95, 0,  60, 0.5, '#FFE070', 0],

  // Flores en la parte inferior central (más pequeñas)
  [35, 0,  50, 1.0, '#FFD700', 0],
  [40, 0,  45, 1.1, '#FFE040', 1],
  [45, 0,  40, 1.2, '#FFC200', 0],
  [50, 0,  45, 1.1, '#FFD700', 1],
  [55, 0,  40, 1.2, '#FFE040', 0],
  [60, 0,  45, 1.0, '#FFC200', 1],
  [65, 0,  50, 0.9, '#FFD700', 0],
];

flowerData.forEach(f => createFlower(...f));
</script>
</body>
</html>
